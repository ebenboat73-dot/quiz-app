<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1efe5">
    <title>Quick Quiz | JavaScript</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #202a23;
            --muted: #69736a;
            --paper: #f1efe5;
            --panel: #fffefa;
            --line: #d9ded3;
            --green: #315b43;
            --green-dark: #234432;
            --lime: #d8eb8a;
            --red: #a53f35;
            --soft-red: #f8e7e3;
            --soft-green: #e8f1df;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(#cdd3c4 0.7px, transparent 0.7px);
            background-size: 18px 18px;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        button { font: inherit; }
        [hidden] { display: none !important; }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 76px;
            padding: 0 clamp(20px, 6vw, 88px);
            border-bottom: 1px solid rgb(32 42 35 / 12%);
            background: rgb(255 254 250 / 72%);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand-mark {
            display: grid;
            width: 31px;
            aspect-ratio: 1;
            place-items: center;
            border-radius: 50%;
            color: var(--panel);
            background: var(--green);
            font-family: Georgia, serif;
            font-size: 19px;
            font-weight: 400;
        }

        .header-note {
            color: var(--muted);
            font-family: Georgia, serif;
            font-size: 15px;
            font-style: italic;
        }

        main {
            width: min(100% - 36px, 780px);
            margin: 0 auto;
            padding: clamp(38px, 8vh, 78px) 0 64px;
        }

        .intro { margin-bottom: 27px; }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        h1, h2, p { margin-top: 0; }

        h1 {
            margin-bottom: 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 7vw, 57px);
            font-weight: 400;
            line-height: 1.04;
        }

        .intro-copy { margin-bottom: 0; color: var(--muted); font-size: 15px; }

        .quiz-panel {
            overflow: hidden;
            border: 1px solid #d7dbd0;
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 18px 50px rgb(38 49 40 / 9%);
            animation: arrive 420ms ease-out both;
        }

        .panel-topline { height: 5px; background: var(--green); }
        .panel-content { padding: clamp(22px, 5vw, 38px); }

        .quiz-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 25px;
        }

        .question-count, .score-label, .timer-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .score-label strong { color: var(--ink); }

        .progress-track, .timer-track {
            overflow: hidden;
            height: 6px;
            border-radius: 99px;
            background: #e8ebe3;
        }

        .progress-track { margin-top: 10px; }

        .progress-fill, .timer-fill {
            height: 100%;
            border-radius: inherit;
            background: var(--green);
            transition: width 220ms ease, background-color 220ms ease;
        }

        .timer-wrap { min-width: 108px; }
        .timer-label { display: flex; justify-content: space-between; margin-bottom: 7px; }
        .timer-fill { background: #c1843e; }
        .timer-fill.is-low { background: var(--red); }

        .question {
            margin: 0 0 23px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(23px, 4vw, 31px);
            font-weight: 400;
            line-height: 1.25;
        }

        .answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

        .answer-button {
            display: flex;
            align-items: center;
            gap: 13px;
            min-height: 62px;
            padding: 12px 15px;
            border: 1px solid var(--line);
            border-radius: 5px;
            color: var(--ink);
            background: #fff;
            cursor: pointer;
            text-align: left;
            transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
        }

        .answer-button:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: var(--green);
            background: #f6f8f1;
        }

        .answer-button:focus-visible, .primary-button:focus-visible, .secondary-button:focus-visible {
            outline: 3px solid #9fbd67;
            outline-offset: 3px;
        }

        .answer-key {
            display: grid;
            flex: 0 0 27px;
            width: 27px;
            aspect-ratio: 1;
            place-items: center;
            border-radius: 50%;
            color: var(--muted);
            background: #f0f1ec;
            font-size: 12px;
            font-weight: 800;
        }

        .answer-button:disabled { cursor: default; }
        .answer-button.is-correct { border-color: #7e9d5c; background: var(--soft-green); }
        .answer-button.is-correct .answer-key { color: white; background: var(--green); }
        .answer-button.is-incorrect { border-color: #d29a91; background: var(--soft-red); }
        .answer-button.is-incorrect .answer-key { color: white; background: var(--red); }

        .feedback {
            min-height: 24px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .feedback.is-correct { color: var(--green-dark); }
        .feedback.is-incorrect { color: var(--red); }

        .panel-actions { display: flex; justify-content: flex-end; margin-top: 22px; }

        .primary-button, .secondary-button {
            min-height: 46px;
            padding: 0 19px;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 800;
        }

        .primary-button { color: white; background: var(--green); }
        .primary-button:hover { background: var(--green-dark); }
        .secondary-button { border: 1px solid var(--line); color: var(--ink); background: white; }

        .loading, .error-message { padding: 25px 0; color: var(--muted); }
        .error-message { color: var(--red); }

        .result-summary {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--line);
        }

        .result-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(30px, 5vw, 42px);
            font-weight: 400;
        }

        .result-score {
            color: var(--green);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 39px;
            white-space: nowrap;
        }

        .result-caption { margin: 7px 0 0; color: var(--muted); }
        .review-list { display: grid; gap: 0; padding: 0; margin: 6px 0 0; list-style: none; }

        .review-item { padding: 20px 0; border-bottom: 1px solid var(--line); }
        .review-item:last-child { border-bottom: 0; }
        .review-question { margin-bottom: 9px; font-weight: 800; line-height: 1.4; }
        .review-answer { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
        .review-answer strong { color: var(--ink); }
        .review-answer.is-correct strong { color: var(--green); }
        .review-answer.is-incorrect strong { color: var(--red); }
        .results-actions { display: flex; justify-content: flex-end; margin-top: 22px; }

        .site-footer { padding: 0 20px 28px; color: var(--muted); font-size: 12px; text-align: center; }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 560px) {
            .site-header { min-height: 65px; }
            .header-note { font-size: 13px; }
            main { width: min(100% - 28px, 780px); padding-top: 38px; }
            .answer-grid { grid-template-columns: 1fr; gap: 9px; }
            .answer-button { min-height: 56px; }
            .quiz-meta { align-items: flex-start; }
            .timer-wrap { min-width: 93px; }
            .result-summary { align-items: flex-start; flex-direction: column; gap: 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand"><span class="brand-mark" aria-hidden="true">Q</span> Quick Quiz</div>
        <span class="header-note">A little practice goes a long way.</span>
    </header>

    <main>
        <section class="intro" aria-labelledby="page-title">
            <p class="eyebrow">JavaScript fundamentals</p>
            <h1 id="page-title">Ready, set, think.</h1>
            <p class="intro-copy">Ten questions. One question at a time.</p>
        </section>

        <section class="quiz-panel" aria-label="JavaScript quiz">
            <div class="panel-topline" aria-hidden="true"></div>
            <div class="panel-content">
                <p id="loading-message" class="loading" role="status">Getting your questions ready...</p>
                <p id="error-message" class="error-message" role="alert" hidden></p>

                <div id="question-view" hidden>
                    <div class="quiz-meta">
                        <div class="progress-wrap">
                            <span id="question-count" class="question-count"></span>
                            <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
                                <div id="progress-fill" class="progress-fill"></div>
                            </div>
                        </div>
                        <div class="timer-wrap" aria-label="Time remaining">
                            <div class="timer-label"><span>Time</span><span id="timer-text">20s</span></div>
                            <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
                        </div>
                    </div>
                    <p class="score-label">Score <strong id="score-value">0</strong></p>
                    <h2 id="question-text" class="question" tabindex="-1"></h2>
                    <div id="answer-list" class="answer-grid" role="group" aria-label="Answer choices"></div>
                    <p id="feedback" class="feedback" aria-live="polite"></p>
                    <div class="panel-actions">
                        <button id="next-button" class="primary-button" type="button" hidden>Next question <span aria-hidden="true">&rarr;</span></button>
                    </div>
                </div>

                <div id="results-view" hidden>
                    <div class="result-summary">
                        <div>
                            <p class="eyebrow">Quiz complete</p>
                            <h2 id="result-title" class="result-title">Nicely done.</h2>
                            <p id="result-caption" class="result-caption"></p>
                        </div>
                        <div id="result-score" class="result-score" aria-label="Final score"></div>
                    </div>
                    <ol id="review-list" class="review-list" aria-label="Answer review"></ol>
                    <div class="results-actions">
                        <button id="restart-button" class="secondary-button" type="button">Try again</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">Take your time, trust what you know.</footer>
    <script src="script.js" defer></script>
</body>
</html>
